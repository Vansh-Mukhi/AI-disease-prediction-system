version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: mds_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - mds_network

  frontend:
    build:
      context: ./frontend
    container_name: mds_frontend
    volumes:
      - ./frontend/static:/usr/share/nginx/html:ro
    networks:
      - mds_network

  backend:
    build:
      context: ./backend
    container_name: mds_backend
    environment:
      - MONGO_URI=mongodb://mongodb:27017/medical_db
      - JWT_SECRET=supersecretjwtkey_replace_me
      - ML_SERVICE_URL=http://ml-service:5001
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
      - ml-service
    networks:
      - mds_network

  ml-service:
    build:
      context: ./ml-service
    container_name: mds_ml_service
    ports:
      - "5001:5001"
    networks:
      - mds_network

  mongodb:
    image: mongo:latest
    container_name: mds_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mds_network

  redis:
    image: redis:alpine
    container_name: mds_redis
    ports:
      - "6379:6379"
    networks:
      - mds_network

networks:
  mds_network:
    driver: bridge

volumes:
  mongo_data:
